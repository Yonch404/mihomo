name: Build Sing-Box Subcore

on:
  workflow_dispatch:
    inputs:
      mihomo_version:
        description: "Mihomo version"
        required: true
      build_suffix:
        description: "Build suffix for this manual build, for example b001"
        required: true
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: true
        default: false
        type: boolean

env:
  SING_BOX_VERSION: "1.13.11"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      mihomo_version: ${{ steps.version.outputs.mihomo_version }}
      sing_box_version: ${{ steps.version.outputs.sing_box_version }}
      build_suffix: ${{ steps.version.outputs.build_suffix }}
      display_build_suffix: ${{ steps.version.outputs.display_build_suffix }}
      release_version: ${{ steps.version.outputs.release_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_MIHOMO_VERSION: ${{ inputs.mihomo_version }}
          INPUT_BUILD_SUFFIX: ${{ inputs.build_suffix }}
        run: |
          set -euo pipefail

          sing_box_version="${SING_BOX_VERSION#v}"
          mihomo_version="${INPUT_MIHOMO_VERSION}"
          build_suffix="${INPUT_BUILD_SUFFIX}"

          sanitize() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^0-9a-z._-]+/-/g; s/^-+//; s/-+$//'
          }

          mihomo_version="$(sanitize "${mihomo_version}")"
          mihomo_version="${mihomo_version#v}"
          sing_box_version="$(sanitize "${sing_box_version}")"
          build_suffix="$(sanitize "${build_suffix}")"

          if [ -z "${mihomo_version}" ]; then
            echo "mihomo_version is required and cannot be empty after sanitization" >&2
            exit 1
          fi
          if [ -z "${sing_box_version}" ]; then
            echo "SING_BOX_VERSION is required and cannot be empty after sanitization" >&2
            exit 1
          fi
          if [ -z "${build_suffix}" ]; then
            echo "build_suffix is required and cannot be empty after sanitization" >&2
            exit 1
          fi

          release_version="v${mihomo_version}-sb.${sing_box_version}-${build_suffix}"
          release_tag="${release_version}"
          display_build_suffix="${build_suffix}"

          echo "mihomo_version=${mihomo_version}" >> "$GITHUB_OUTPUT"
          echo "sing_box_version=${sing_box_version}" >> "$GITHUB_OUTPUT"
          echo "build_suffix=${build_suffix}" >> "$GITHUB_OUTPUT"
          echo "display_build_suffix=${display_build_suffix}" >> "$GITHUB_OUTPUT"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, goamd64: v1, output: linux-amd64-v1, ext: "" }
          - { goos: linux, goarch: amd64, goamd64: v2, output: linux-amd64-v2, ext: "" }
          - { goos: linux, goarch: amd64, goamd64: v3, output: linux-amd64-v3, ext: "" }
          - { goos: linux, goarch: arm64, goamd64: "", output: linux-arm64, ext: "" }
          - { goos: windows, goarch: amd64, goamd64: v1, output: windows-amd64-v1, ext: ".exe" }
          - { goos: windows, goarch: amd64, goamd64: v2, output: windows-amd64-v2, ext: ".exe" }
          - { goos: windows, goarch: amd64, goamd64: v3, output: windows-amd64-v3, ext: ".exe" }
          - { goos: windows, goarch: arm64, goamd64: "", output: windows-arm64, ext: ".exe" }

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.26"

      - name: Fix issue77930 for Golang1.26
        run: |
          set -euo pipefail
          patch_file="$GITHUB_WORKSPACE/.github/patch/issue77930.patch"
          cd "$(go env GOROOT)"
          if patch --batch --forward --dry-run -p 1 < "$patch_file"; then
            patch --verbose --batch --forward -p 1 < "$patch_file"
          elif patch --batch --reverse --dry-run -p 1 < "$patch_file"; then
            echo "issue77930 patch already applied; skip"
          else
            echo "issue77930 patch cannot be applied cleanly" >&2
            exit 1
          fi

      - name: Set variables
        run: |
          echo "SING_BOX_VERSION=${{ needs.meta.outputs.sing_box_version }}" >> "$GITHUB_ENV"
          echo "MIHOMO_VERSION=${{ needs.meta.outputs.mihomo_version }}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${{ needs.meta.outputs.release_version }}" >> "$GITHUB_ENV"
          echo "BUILDTIME=$(date)" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=0" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Prepare sing-box assets
        run: |
          bash .github/scripts/prepare-singbox-assets.sh \
            "${SING_BOX_VERSION}" \
            "${{ matrix.goos }}" \
            "${{ matrix.goarch }}"

      - name: Build core with sing-box subcore
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64_VARIANT: ${{ matrix.goamd64 }}
        run: |
          mkdir -p dist
          if [ -n "${GOAMD64_VARIANT}" ] && [ "${GOAMD64_VARIANT}" != "null" ]; then
            export GOAMD64="${GOAMD64_VARIANT}"
          fi
          go build -v -tags "with_gvisor with_singbox" -trimpath \
            -ldflags "-extldflags --static -X 'github.com/metacubex/mihomo/constant.Version=${RELEASE_VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid=" \
            -o "dist/mihomo-singbox-${{ matrix.output }}${{ matrix.ext }}"

      - name: Package
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -9 "mihomo-singbox-${{ matrix.output }}-${RELEASE_VERSION}.zip" "mihomo-singbox-${{ matrix.output }}${{ matrix.ext }}")
          else
            gzip -9n -c "dist/mihomo-singbox-${{ matrix.output }}" > "dist/mihomo-singbox-${{ matrix.output }}-${RELEASE_VERSION}.gz"
          fi

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mihomo-singbox-${{ matrix.output }}
          path: |
            dist/*.gz
            dist/*.zip

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          printf '%s\n' "${{ needs.meta.outputs.release_version }}" > version.txt
          find . -maxdepth 1 -type f ! -name "checksums.*" ! -name "version.txt" -printf '%P\0' | sort -z | xargs -0 -r sha256sum > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.release_tag }}
          name: ${{ needs.meta.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease }}
          overwrite_files: true
          body: |
            mihomo main version: `${{ needs.meta.outputs.mihomo_version }}`
            sing-box version: `${{ needs.meta.outputs.sing_box_version }}`
            build suffix: `${{ needs.meta.outputs.display_build_suffix }}`
            commit: `${{ github.sha }}`

            This release contains sing-box subcore builds for Linux amd64 v1/v2/v3, Linux arm64, Windows amd64 v1/v2/v3, and Windows arm64.
